<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17201d;--mut:#5d6a66;--line:#d8dfdc;--acc:#1f6f5c;--accbg:#e2f1ec;--bad:#b3261e;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--card:#1b2220;--ink:#e8eeec;--mut:#9aa8a3;--line:#2f3a37;--acc:#4fbf9f;--accbg:#1d3a32}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
header .on{flex:1;min-width:0;background:none;border:0;color:#fff;text-align:left;padding:4px 0}
header .on b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .on small{opacity:.85}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}nav button.on{color:var(--acc);font-weight:600}nav svg{width:24px;height:24px}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big button{border:0;border-radius:16px;padding:22px 8px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.big button.alt{background:var(--card);color:var(--acc);border:2px solid var(--acc)}.big svg{width:36px;height:36px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;min-height:48px}.btn.alt{background:var(--card);color:var(--acc);border:1.5px solid var(--acc)}.btn.bad{background:none;color:var(--bad);border:1.5px solid var(--bad)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
input.t,textarea.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);min-height:48px}input.t:focus,textarea.t:focus{border-color:var(--acc);outline:none}

.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;min-height:42px;white-space:nowrap}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.chip.sq{min-width:44px;padding:9px 0;text-align:center;border-radius:10px}
.prev{width:100%;max-height:32vh;object-fit:contain;border-radius:10px;background:#0002;display:block}
.sticky{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;margin-top:8px}.sticky .btn{flex:1}
.rec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.rec .btn{min-height:44px;padding:8px 14px}.rec.on .recb{background:var(--bad)}audio{height:40px;max-width:100%}
.grp{margin:14px 0 6px;font-weight:700;display:flex;justify-content:space-between;color:var(--mut)}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:8px;width:100%;text-align:left}
.item img{width:88px;height:88px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}.item b{font-size:15px}.item .m{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}.msg{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;background:#222;color:#fff;border-radius:10px;padding:12px 14px;display:none}.msg.on{display:block}
.olist button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}.olist button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv span{color:var(--mut)}
.cnt{background:var(--accbg);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:13px;font-weight:600}
.sg{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}.sg summary{font-weight:600;min-height:32px}.sgi{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:4px 0;background:var(--bg);font-size:14px}.sgsel{margin-top:8px;padding:8px 10px;border:1.5px solid var(--acc);border-radius:10px;font-size:14px;display:flex;gap:8px;align-items:center}.sgsel .chip{margin-left:auto;min-height:32px;padding:4px 10px}
</style>
</head>

 files.push(["перечень фото.csv",csv]);
 files.push(["fotofix.json",JSON.stringify({app:"Фотофиксация обследования",kind:"fotofix",v:1,saved:new Date().toISOString(),obj:{id:o.id,name:o.name,created:o.created},photos:rows.map(r=>({id:r.id,n:r.n,t:r.t,struct:r.struct,mark:r.mark,axes:r.axes,floor:r.floor,defect:r.defect,crack:r.crack,mat:r.mat||"",sign:r.sign||"",cat:r.cat||0,note:r.note,w:r.w,h:r.h,file:r.file,audio:r.audioFile,audioType:r.audio||""}))},null,1)]);
 const d=new Date(),nm=`Фотофиксация ${o.name.replace(/[\\/:*?"<>|]/g," ").trim().slice(0,50)} ${d.toLocaleDateString("ru-RU")}.zip`;return{blob:zip(files),name:nm}}
// ---------- события ----------
document.addEventListener("toggle",ev=>{if(ev.target.classList&&ev.target.classList.contains("sg"))S.sgOpen=ev.target.open},true);
document.addEventListener("click",async ev=>{const t=ev.target.closest("button");if(!t)return;const id=t.id;
 if(t.dataset.nav){if(S.edit&&!confirm("Выйти без сохранения снимка?"))return;if(S.edit){if(S.rec)await stopRec();S.edit=null;S.queue=[]}S.view=t.dataset.nav;render();return}
 if(id==="hdr"){if(S.edit)return;S.view="objs";render();return}
 if(id==="b-cam"){$("#cam").click();return}if(id==="b-gal"){$("#gal").click();return}
 if(id==="b-onew"){const nm=$("#o-new").value.trim();if(!nm){$("#o-new").focus();return}const o={id:uid(),name:nm,created:new Date().toISOString(),t:new Date().toISOString()};await tx("obj","readwrite",s=>s.put(o));S.objs.unshift(o);S.cur=o.id;localStorage.setItem("ff_cur",o.id);await loadPhotos();S.view="shot";render();msg("Объект создан");return}
 if(t.dataset.obj){S.cur=t.dataset.obj;localStorage.setItem("ff_cur",S.cur);await loadPhotos();S.view="shot";render();return}
 if(id==="b-oren"){const o=obj(),nm=prompt("Название объекта",o.name);if(nm&&nm.trim()){o.name=nm.trim();await tx("obj","readwrite",s=>s.put(o));render()}return}
 if(id==="b-odel"){const o=obj();if(!confirm(`Удалить объект «${o.name}» и все его фото (${S.photos.length}) с телефона?\n\nПередали ли вы файл в офис?`))return;
  await tx(["obj","photo","blob"],"readwrite",([a,p,b])=>{a.delete(o.id);S.photos.forEach(x=>{p.delete(x.id);b.delete(x.id);b.delete(x.id+".a")})});S.objs=S.objs.filter(x=>x.id!==o.id);S.cur=S.objs[0]?S.objs[0].id:"";localStorage.setItem("ff_cur",S.cur);await loadPhotos();render();msg("Объект удален");return}
 if(t.dataset.edit){const p=S.photos.find(x=>x.id===t.dataset.edit);S.edit=Object.assign({},p,{isNew:false});if(p.audio){const a=await tx("blob","readonly",s=>s.get(p.id+".a"));if(a)S.edit.audioUrl=URL.createObjectURL(a)}S.edit.url=await thumb(p.id);render();window.scrollTo(0,0);return}
 if(t.dataset.c){const e=S.edit;readForm();const v=t.dataset.v,c=t.dataset.c;
  if(c==="struct"){if(e.struct!==v)e.mark="";e.struct=e.struct===v?"":v;if(e.struct&&!e.sign)e.mat=matGuess(e.struct)}else if(c==="floor"){e.floor=e.floor===v?"":v}else if(c==="defect"){e.defect=e.defect===v?"":v;if(v!=="Трещина")e.crack=""}else if(c==="mat"){if(e.mat!==v){e.sign="";e.cat=0}e.mat=e.mat===v?"":v;S.sgOpen=!!e.mat}else if(c==="sign"){e.sign=v;e.cat=v?+t.dataset.cat:0;S.sgOpen=false}
  else{const a=axParts(e.axes),k=c==="axl"?"l":"n";let arr=a[k];if(arr.length===1&&arr[0]!==v)arr=[arr[0],v];else if(arr.length===1&&arr[0]===v)arr=[];else arr=[v];a[k]=arr;e.axes=(a.l.join("-")||"")+(a.n.length?"/"+a.n.join("-"):"")}
  const y=window.scrollY;render();window.scrollTo(0,y);if(c==="defect"&&v==="Трещина"){const x=$("#f-crack");if(x)x.focus()}return}
 if(id==="r-start"){startRec();return}
 if(id==="r-stop"){await stopRec();readForm();$("#rec").outerHTML=`<div class="rec" id="rec">${recHtml()}</div>`;return}
 if(id==="r-del"){const e=S.edit;e.audioNew=null;e.audioDel=true;e.audio=null;$("#rec").outerHTML=`<div class="rec" id="rec">${recHtml()}</div>`;return}
 if(id==="f-save"||id==="f-next"){await saveEdit();if(S.queue.length){await nextQueued();return}if(id==="f-next"){render();$("#cam").click();return}S.view=S.view==="list"?"list":"shot";render();window.scrollTo(0,0);return}
 if(id==="f-del"){const e=S.edit;if(!confirm(`Удалить фото № ${e.n}?`))return;await tx(["photo","blob"],"readwrite",([p,b])=>{p.delete(e.id);b.delete(e.id);b.delete(e.id+".a")});urls.delete(e.id);S.edit=null;await loadPhotos();render();msg("Фото удалено");return}
 if(id==="f-cancel"){if(S.rec)await stopRec();const e=S.edit;if(e&&e.isNew&&e.url)URL.revokeObjectURL(e.url);S.edit=null;if(S.queue.length){await nextQueued();return}render();return}
 if(id==="b-share"||id==="b-dl"){t.disabled=true;msg("Собираю файл…");try{const{blob,name}=await buildZip();const f=new File([blob],name,{type:"application/zip"});
  if(id==="b-share"&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name})}else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);msg("Файл сохранен в загрузки")}}
  catch(e){if(e&&e.name!=="AbortError")msg("Не удалось: "+(e.message||e))}t.disabled=false;return}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="o-new"){e.preventDefault();$("#b-onew").click()}});
async function startEdit(file){try{const{b,w,h}=await shrink(file);S.edit=newEdit(file,b,w,h);render();window.scrollTo(0,0)}catch(e){msg("Не удалось открыть фото: "+e.message)}}
async function nextQueued(){const f=S.queue.shift();await startEdit(f)}
$("#cam").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(f)await startEdit(f)});
$("#gal").addEventListener("change",async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;S.queue=fs.slice(1);await startEdit(fs[0])});
window.addEventListener("beforeunload",e=>{if(S.edit&&S.edit.isNew){e.preventDefault();e.returnValue=""}});
(async()=>{try{DB=await idb()}catch(e){$("#m").innerHTML='<div class="card"><p>Браузер не дает хранить данные (возможно, приватный режим). Откройте страницу в обычном окне.</p></div>';return}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 await load();if(!obj())S.view="objs";render();
 if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
</body>
</html>
